<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1c1f26;
        }
    </style>
</head>
<body>

    <!-- ===== Struktur Modal Login Bootstrap 5 ===== -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true" data-bs-theme="dark">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-secondary shadow">

                <!-- Bagian Atas Form & Tombol Close -->
                <div class="modal-header border-bottom-0 pb-0">
                    <h1 class="modal-title fs-5" id="loginModalLabel">Masuk ke Akun Anda</h1>
                    <!-- Tombol X untuk menutup dan kembali ke menu utama -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Isian Form Login -->
                <div class="modal-body pt-3">
                    <form id="loginForm">
                        <!-- Input Email / Username -->
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                            <label for="floatingInput">Alamat Email / Username</label>
                        </div>

                        <!-- Input Password -->
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                            <label for="floatingPassword">Kata Sandi</label>
                        </div>

                        <!-- Opsi Ingat Saya & Lupa Password -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                <label class="form-check-label text-secondary small" for="rememberMe">Ingat saya</label>
                            </div>
                            <a href="#" class="text-warning text-decoration-none small">Lupa sandi?</a>
                        </div>

                        <!-- Tombol Submit Login -->
                        <button class="w-100 btn btn-lg btn-warning fw-bold text-dark mb-2" type="submit">Masuk</button>

                        <p class="text-center text-secondary small mt-3 mb-0">Belum punya akun? <a href="#" class="text-warning text-decoration-none">Daftar sekarang</a></p>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script>
        // Tampilkan modal login otomatis saat halaman ini dibuka
        document.addEventListener('DOMContentLoaded', function () {
            const loginModal = new bootstrap.Modal(document.getElementById('loginModal'), {
                backdrop: 'static' // klik di luar modal tidak menutupnya, harus lewat tombol X
            });
            loginModal.show();
        });

        // Contoh sederhana validasi submit (sesuaikan dengan backend Anda)
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('floatingInput').value;
            const password = document.getElementById('floatingPassword').value;

            if (email && password) {
                alert('Login berhasil (contoh)! Ganti bagian ini dengan proses autentikasi Anda.');
                // window.location.href = "home.html"; // arahkan ke halaman lain setelah login
            }
        });
    </script>

</body>
</html>
